name: Coletar mais lidas

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Limite do GitHub e 6h. Rodamos ~4,8h e passamos o bastao.
    # Intervalo de 8 min entre coletas: a publicacao do Pages leva ~6 min
    # e era cancelada pelo commit seguinte quando o intervalo era de 5 min.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # Usa o PAT para que os commits do dados.json disparem o workflow
          # "Publicar site". Push feito com o GITHUB_TOKEN padrao NAO dispara
          # outros workflows (trava anti-recursao do GitHub).
          token: ${{ secrets.PAT_RONDA || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Coletar em ciclo por ~5 horas (a cada 8 min)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          for i in $(seq 1 35); do
            echo "===== ciclo $i / 35 ====="
            git pull --rebase origin main || git rebase --abort || true

            if python coletar.py; then
              git add dados.json
              git commit -m "Atualiza dados $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "sem mudancas"
              git push || echo "push falhou; tenta no proximo ciclo"
            else
              echo "coleta falhou neste ciclo; segue para o proximo"
            fi

            sleep 480
          done

      - name: Passar o bastao para a proxima execucao
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_RONDA || secrets.GITHUB_TOKEN }}
        run: |
          # Se houver outra execucao em curso mais antiga que esta,
          # ela e quem continua a corrente. Esta encerra sem duplicar.
          # A checagem e feita SO NO FIM, entao nenhum trabalho e perdido.
          MAIS_ANTIGA=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/coleta.yml/runs?status=in_progress&per_page=100" \
            | jq -r '[.workflow_runs[].id] | min // empty')

          if [ -n "$MAIS_ANTIGA" ] && [ "$MAIS_ANTIGA" != "${{ github.run_id }}" ]; then
            echo "Execucao mais antiga ($MAIS_ANTIGA) segue rodando. Encerrando sem duplicar."
            exit 0
          fi

          echo "Passando o bastao."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/coleta.yml/dispatches" \
            -d '{"ref":"main"}'
